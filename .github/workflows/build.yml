name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check generated files
        run: |
          make generate
          git diff --exit-code
      - run: go vet ./...
      - run: go build ./...

  release-and-push:
    name: Release And Push
    runs-on: ubuntu-latest
    needs: build
    if: github.repository == 'casdoor/casdoor-operator' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release
        run: npx semantic-release@24
        env:
          GH_TOKEN: ${{ secrets.GH_BOT_TOKEN }}

      - name: Get version
        id: version
        run: |
          tag=$(git describe --tags --exact-match 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.tag != ''
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.tag != ''

      - uses: docker/login-action@v3
        if: steps.version.outputs.tag != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v6
        if: steps.version.outputs.tag != ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            casbin/casdoor-operator:${{ steps.version.outputs.version }}
            casbin/casdoor-operator:${{ steps.version.outputs.tag }}
            casbin/casdoor-operator:latest
