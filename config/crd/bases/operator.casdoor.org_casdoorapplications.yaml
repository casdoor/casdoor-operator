---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: casdoorapplications.operator.casdoor.org
spec:
  group: operator.casdoor.org
  names:
    kind: CasdoorApplication
    listKind: CasdoorApplicationList
    plural: casdoorapplications
    shortNames:
    - casdoorapp
    singular: casdoorapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.casdoorRef.name
      name: Casdoor
      type: string
    - jsonPath: .spec.organization
      name: Organization
      type: string
    - jsonPath: .status.clientId
      name: Client ID
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CasdoorApplication is an application in a Casdoor server.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CasdoorApplicationSpec describes an application. Fields other than casdoorRef, name,
              deletionPolicy, clientSecretSecretRef, credentialsSecretName and extraFields keep the names
              of the Casdoor API, and only the fields that are set are written.
            properties:
              casdoorRef:
                description: CasdoorReference selects the Casdoor server an object
                  is created in.
                properties:
                  external:
                    description: External is a Casdoor server not managed by this
                      operator.
                    properties:
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef points to a Secret with the clientId and clientSecret keys of an
                          application in the built-in organization, which can manage every organization.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      endpoint:
                        description: Endpoint is the URL of the server, e.g. https://door.example.com.
                        pattern: ^https?://.+
                        type: string
                    required:
                    - credentialsSecretRef
                    - endpoint
                    type: object
                  name:
                    description: Name of a Casdoor object in the same namespace.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of name and external must be set
                  rule: has(self.name) != has(self.external)
              cert:
                description: Cert is the name of the certificate that signs the tokens.
                type: string
              clientId:
                description: ClientId is generated by Casdoor when empty.
                type: string
              clientSecretSecretRef:
                description: ClientSecretSecretRef sets the client secret. Casdoor
                  generates one when it is empty.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              credentialsSecretName:
                description: |-
                  CredentialsSecretName is the Secret the operator writes endpoint, clientId, clientSecret,
                  organizationName, applicationName and certificate to. Defaults to <name>-casdoor.
                type: string
              deletionPolicy:
                default: Delete
                description: DeletionPolicy decides whether deleting this object deletes
                  the application in Casdoor.
                enum:
                - Delete
                - Retain
                type: string
              description:
                type: string
              displayName:
                type: string
              enablePassword:
                type: boolean
              enableSignUp:
                type: boolean
              expireInHours:
                format: int32
                minimum: 1
                type: integer
              extraFields:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: ExtraFields sets any other field of the Casdoor application,
                  e.g. signinMethods or providers.
                type: object
              grantTypes:
                items:
                  type: string
                type: array
              homepageUrl:
                type: string
              logo:
                type: string
              name:
                description: Name of the application in Casdoor. Defaults to the name
                  of this object.
                type: string
                x-kubernetes-validations:
                - message: name is immutable
                  rule: self == oldSelf
              organization:
                description: Organization the users of this application belong to.
                minLength: 1
                type: string
              redirectUris:
                items:
                  type: string
                type: array
              refreshExpireInHours:
                format: int32
                minimum: 1
                type: integer
              tokenFormat:
                enum:
                - JWT
                - JWT-Empty
                - JWT-Custom
                - JWT-Standard
                type: string
            required:
            - casdoorRef
            - organization
            type: object
          status:
            properties:
              clientId:
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsSecretName:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
